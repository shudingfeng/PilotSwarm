name: Deploy Azure stamp
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published release tag to deploy (blank deploys current main)
        required: false
        default: ""
      reconcile_release_config:
        description: Apply current infrastructure/configuration to existing release images without rebuilding or pushing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: azure-deploy
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select immutable release source when requested
        id: source
        if: inputs.release_tag != '' || inputs.reconcile_release_config
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RECONCILE_RELEASE_CONFIG: ${{ inputs.reconcile_release_config }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A published vX.Y.Z release tag is required." >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != false ]]; then
            echo "The selected release must be published." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "The selected release must belong to main history." >&2
            exit 1
          fi
          if ! image_tag="$(git rev-parse --short=12 "${RELEASE_TAG}^{commit}")"; then
            echo "Cannot resolve the release image tag." >&2
            exit 1
          fi
          echo "image-tag=$image_tag" >> "$GITHUB_OUTPUT"
          if [ "$RECONCILE_RELEASE_CONFIG" = "true" ]; then
            echo "Reconciling current deployment configuration with existing $RELEASE_TAG images."
          else
            git checkout --detach "$RELEASE_TAG"
            echo "Deploying published release $RELEASE_TAG at $(git rev-parse HEAD)"
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy checked-out source
        uses: ./.github/actions/deploy-azure
        with:
          reconcile-release-config: ${{ inputs.reconcile_release_config }}
          image-tag: ${{ steps.source.outputs.image-tag }}
        env:
          AZURE_DEPLOY_ENV: ${{ secrets.AZURE_DEPLOY_ENV }}
          AZURE_FOUNDRY_DEPLOYMENTS_JSON: ${{ secrets.AZURE_FOUNDRY_DEPLOYMENTS_JSON }}
          AZURE_MODEL_PROVIDERS_JSON: ${{ secrets.AZURE_MODEL_PROVIDERS_JSON }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_DEPLOY_PRINCIPAL_OBJECT_ID: ${{ secrets.AZURE_DEPLOY_PRINCIPAL_OBJECT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # Plain switches, from the environment's variables rather than the
          # secret. A set variable wins over the same key in AZURE_DEPLOY_ENV;
          # an unset one is empty and changes nothing (loadEnv in
          # deploy/scripts/lib/common.mjs).
          WORKSPACES_ENABLED: ${{ vars.WORKSPACES_ENABLED }}
          USER_POOL_MIN_COUNT: ${{ vars.USER_POOL_MIN_COUNT }}
          PILOTSWARM_NATIVE_SUBAGENTS: ${{ vars.PILOTSWARM_NATIVE_SUBAGENTS }}
          # The portal's optional settings and the Windows worker pool
          # (deploy/providers/azure/envs/template.env), the same way. The pool
          # needs EDGE_MODE afd or private: on a public stamp the deploy
          # refuses WIN_WORKERS_ENABLED=true before any step.
          PILOTSWARM_REQUIRE_FINE_GRAINED_GH_PAT: ${{ vars.PILOTSWARM_REQUIRE_FINE_GRAINED_GH_PAT }}
          PILOTSWARM_PERSONAL_SECRETS: ${{ vars.PILOTSWARM_PERSONAL_SECRETS }}
          PILOTSWARM_PERSONAL_SECRET_STORE_MODULE: ${{ vars.PILOTSWARM_PERSONAL_SECRET_STORE_MODULE }}
          PILOTSWARM_PERSONAL_SECRET_VAULT_URI: ${{ vars.PILOTSWARM_PERSONAL_SECRET_VAULT_URI }}
          PILOTSWARM_OWNER_ROUTING: ${{ vars.PILOTSWARM_OWNER_ROUTING }}
          PILOTSWARM_WORKSPACE_BUSY_FAST_RELEASE: ${{ vars.PILOTSWARM_WORKSPACE_BUSY_FAST_RELEASE }}
          PILOTSWARM_DEFAULT_IDLE_TIMEOUT_SEC: ${{ vars.PILOTSWARM_DEFAULT_IDLE_TIMEOUT_SEC }}
          PILOTSWARM_SESSION_MESSAGE_SCOPE: ${{ vars.PILOTSWARM_SESSION_MESSAGE_SCOPE }}
          DISPATCHER_SP_OBJECT_ID: ${{ vars.DISPATCHER_SP_OBJECT_ID }}
          WIN_WORKERS_ENABLED: ${{ vars.WIN_WORKERS_ENABLED }}
          WIN_WORKER_ALERT_EMAILS: ${{ vars.WIN_WORKER_ALERT_EMAILS }}
          WIN_WORKER_IMAGE_VERSION: ${{ vars.WIN_WORKER_IMAGE_VERSION }}
          WIN_WORKER_VM_SIZE: ${{ vars.WIN_WORKER_VM_SIZE }}
          WIN_WORKER_COUNT: ${{ vars.WIN_WORKER_COUNT }}
          WIN_WORKER_MIN_RUNNING: ${{ vars.WIN_WORKER_MIN_RUNNING }}
          WIN_WORKER_STANDBY_MIN: ${{ vars.WIN_WORKER_STANDBY_MIN }}
          WIN_WORKER_IDLE_RECYCLE_MINUTES: ${{ vars.WIN_WORKER_IDLE_RECYCLE_MINUTES }}
          WIN_WORKER_SCALE_IN_BATCH: ${{ vars.WIN_WORKER_SCALE_IN_BATCH }}
          WIN_WORKER_SCALE_IN_INTERVAL_MINUTES: ${{ vars.WIN_WORKER_SCALE_IN_INTERVAL_MINUTES }}
          WIN_WORKER_COORDINATION_HOST: ${{ vars.WIN_WORKER_COORDINATION_HOST }}
          WIN_WORKER_COORDINATION_HOST_REPLICAS: ${{ vars.WIN_WORKER_COORDINATION_HOST_REPLICAS }}
          WIN_WORKER_COORDINATION_HOST_PLUGIN_CONFIGMAP: ${{ vars.WIN_WORKER_COORDINATION_HOST_PLUGIN_CONFIGMAP }}
          WIN_WORKER_COORDINATION_HOST_REDACT_SECRET_PREFIXES: ${{ vars.WIN_WORKER_COORDINATION_HOST_REDACT_SECRET_PREFIXES }}
          WIN_WORKER_WORKING_HOURS: ${{ vars.WIN_WORKER_WORKING_HOURS }}
          WIN_WORKER_EXTRA_ENV: ${{ vars.WIN_WORKER_EXTRA_ENV }}
          WIN_WORKER_FEED_ENDPOINTS: ${{ vars.WIN_WORKER_FEED_ENDPOINTS }}
          WIN_WORKER_STANDBY_POOL_PRINCIPAL_ID: ${{ vars.WIN_WORKER_STANDBY_POOL_PRINCIPAL_ID }}
          WIN_DEV_DRIVE_POOL_COUNT: ${{ vars.WIN_DEV_DRIVE_POOL_COUNT }}
          WIN_DEV_DRIVE_SPARE_COUNT: ${{ vars.WIN_DEV_DRIVE_SPARE_COUNT }}
          WIN_DEV_DRIVE_MAX_PER_USER: ${{ vars.WIN_DEV_DRIVE_MAX_PER_USER }}
          WIN_DEV_DRIVE_LEASE_EXPIRY_DAYS: ${{ vars.WIN_DEV_DRIVE_LEASE_EXPIRY_DAYS }}
          WIN_DEV_DRIVE_SIZE_GB: ${{ vars.WIN_DEV_DRIVE_SIZE_GB }}
          WIN_DEV_DRIVE_GROW_FREE_PERCENT: ${{ vars.WIN_DEV_DRIVE_GROW_FREE_PERCENT }}
          WIN_DEV_DRIVE_GROW_STEP_GB: ${{ vars.WIN_DEV_DRIVE_GROW_STEP_GB }}
          WIN_DEV_DRIVE_MAX_GB: ${{ vars.WIN_DEV_DRIVE_MAX_GB }}
          WIN_DEV_DRIVE_IOPS: ${{ vars.WIN_DEV_DRIVE_IOPS }}
