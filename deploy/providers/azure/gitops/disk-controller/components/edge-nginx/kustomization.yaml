apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Edge mode private: the AKS app-routing NGINX on an internal load balancer.
#
# The dispatcher Ingress joins the portal's host on the same NGINX, with the
# same TLS Secret as the portal's edge-nginx component. NGINX opens its own TLS
# connection to the pod and checks it:
#   - proxy-ssl-secret: the Secret that the TLS step writes with the
#     controller's private CA as `ca.crt` (tls.mjs, caClusterManifest), in this
#     namespace;
#   - proxy-ssl-name: the dispatcher Service's cluster DNS name, which the
#     controller's leaf names. Both must match the overlay's namespace.
#
# The NetworkPolicy admits the dispatcher port from the app-routing pods only.

resources:
  - network-policy-dispatcher.yaml

patches:
  - target:
      kind: Ingress
      name: pilotswarm-disk-controller-dispatcher
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: pilotswarm-disk-controller-dispatcher
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-secret: pilotswarm/pilotswarm-disk-controller-ca
          nginx.ingress.kubernetes.io/proxy-ssl-name: pilotswarm-disk-controller-dispatcher.pilotswarm.svc
      spec:
        ingressClassName: webapprouting.kubernetes.azure.com
        tls:
          - secretName: pilotswarm-portal-tls
            hosts:
              - __PORTAL_HOSTNAME__
