apiVersion: v1
kind: ServiceAccount
metadata:
  name: pilotswarm-disk-controller
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: disk-controller
  annotations:
    # The controller's own user-assigned identity, federated with this service
    # account. The overlay fills its client ID from WORKLOAD_IDENTITY_CLIENT_ID.
    azure.workload.identity/client-id: __WORKLOAD_IDENTITY_CLIENT_ID__
# The controller never calls the Kubernetes API. Workload identity projects a
# token of its own.
automountServiceAccountToken: false
