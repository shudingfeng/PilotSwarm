apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pilotswarm-disk-controller-tls
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: disk-controller
spec:
  provider: azure
  # The controller's server certificate: the PEM bundle (leaf, private CA,
  # leaf key) that the TLS step (deploy/providers/azure/disk-controller/tls.mjs)
  # writes as the secret `disk-controller-tls` in the stamp vault, and grants
  # the controller's identity on that one secret. It is mounted as one file and
  # never synthesized into a Kubernetes Secret, so the key exists only in the
  # pod. When the step renews the leaf, the driver's rotation rewrites the file
  # and the controller loads it without a restart.
  parameters:
    usePodIdentity: "false"
    clientID: __WORKLOAD_IDENTITY_CLIENT_ID__
    keyvaultName: __KV_NAME__
    tenantId: __AZURE_TENANT_ID__
    objects: |
      array:
        - |
          objectName: disk-controller-tls
          objectType: secret
