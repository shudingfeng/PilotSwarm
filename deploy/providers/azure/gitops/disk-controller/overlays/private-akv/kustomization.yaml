apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# EDGE_MODE=private, TLS_SOURCE=akv or akv-selfsigned: the dispatcher Ingress
# joins the portal's host on the app-routing NGINX. Same namespace as the
# portal; the names in edge-nginx and the TLS step's leaf follow it.
namespace: pilotswarm

resources:
  - ../../base

components:
  - ../../components/edge-nginx
  - ../../components/replacements

configMapGenerator:
  - name: disk-controller-env
    envs:
      - .env
