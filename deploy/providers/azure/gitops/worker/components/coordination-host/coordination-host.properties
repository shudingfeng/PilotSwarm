# The coordination host's values that depend on the stamp, as the overlay's
# .env: stage-manifests.mjs rewrites each line from the deploy's settings
# (deploy/scripts/lib/coordination-host.mjs) and drops the redaction prefixes
# when WIN_WORKER_COORDINATION_HOST_REDACT_SECRET_PREFIXES is unset. The
# placeholders below are never deployed.
#
#   PS_COORDINATION_URL                 the disk controller's coordination
#                                       Service in this namespace, port 3005
#   PS_COORDINATION_TOKEN_SCOPE         the portal's Entra app; the host's
#                                       identity needs its coordinator role
#   PILOTSWARM_REDACT_SECRET_PREFIXES   token prefixes redacted from what the
#                                       worker persists
PS_COORDINATION_URL=https://placeholder.invalid:3005
PS_COORDINATION_TOKEN_SCOPE=placeholder
PILOTSWARM_REDACT_SECRET_PREFIXES=placeholder
